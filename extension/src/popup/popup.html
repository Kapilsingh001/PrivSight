<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivSight</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1f2937;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 60px;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { background: #9ca3af; cursor: default; }
    h2 { font-size: 13px; margin: 14px 0 6px; }
    #status {
      list-style: none;
      margin: 0;
      padding: 8px;
      min-height: 40px;
      background: #f3f4f6;
      border-radius: 6px;
    }
    #status li { padding: 2px 0; }
    #status li.success { color: #15803d; }
    #status li.error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>PrivSight</h1>

  <label for="task">Task</label>
  <textarea id="task">Find the cheapest black shirt and click Buy Now</textarea>
  <button id="run">Run</button>

  <h2>Status</h2>
  <ul id="status"></ul>

  <script type="module" src="popup.ts"></script>
</body>
</html>
